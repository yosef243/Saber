<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f382c" />
    <meta name="description" content="صدقة جارية: مسبحة، أذكار، أدعية، وروابط تذكارية." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>صدقة جارية | Saber</title>
    <script>
      window.addEventListener('error', (event) => {
        const failedModule = event.target instanceof HTMLScriptElement && event.target.type === 'module';
        if (!failedModule && event.target !== window) return;
        console.error('[Saber] Application script failed:', event.error || event.message || event.target.src);
        const showFailure = () => {
          const app = document.getElementById('app');
          if (app && !app.hasChildNodes()) {
            app.textContent = 'تعذر تحميل التطبيق. يرجى تحديث الصفحة.';
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showFailure, { once: true });
        } else {
          showFailure();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
