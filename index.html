<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (window.location.hostname.includes('github.io')) {
        const cleanPath = window.location.pathname.replace(/^\/Saber(?=\/|$)/, '');
        let query = window.location.search;
        const hashQuery = window.location.hash.split('?')[1];

        if (!query && !(hashQuery && new URLSearchParams(hashQuery).has('name'))) {
          try {
            let profile = null;
            try {
              profile = JSON.parse(window.localStorage.getItem('saber.v2.memorial') || 'null');
            } catch {
              // A malformed newer profile should not hide valid legacy data.
            }

            const profileName = typeof profile?.name === 'string' ? profile.name.trim() : '';
            const savedName = profileName ||
              window.localStorage.getItem('savedDeceasedName')?.trim() ||
              window.localStorage.getItem('memorial_name')?.trim();

            if (savedName) {
              const savedGender = profileName
                ? profile.gender
                : window.localStorage.getItem('appGender') || window.localStorage.getItem('memorial_gender');
              query = '?name=' + encodeURIComponent(savedName) + '&g=' + (savedGender === 'f' ? 'f' : 'm');
              if (profileName && typeof profile.customMessage === 'string' && profile.customMessage.trim()) {
                query += '&message=' + encodeURIComponent(profile.customMessage.trim());
              }
            }
          } catch {
            // Storage may be disabled; still redirect using the original URL.
          }
        }

        const navigatorWithStandalone = navigator;
        const isStandalone = (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches) ||
          navigatorWithStandalone.standalone === true;
        if (isStandalone) {
          const redirectParams = new URLSearchParams(query);
          redirectParams.set('standalone', '1');
          query = '?' + redirectParams.toString();
        }

        const destination = 'https://sabry.pages.dev' + cleanPath + query + window.location.hash;
        window.location.replace(destination);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D3B2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="صدقة جارية" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="./icons/icon-180x180.png" />
    <meta name="description" content="صدقة جارية: مسبحة، أذكار، أدعية، وروابط تذكارية." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>صدقة جارية | Saber</title>
    <script>
      window.addEventListener('error', (event) => {
        const failedModule = event.target instanceof HTMLScriptElement && event.target.type === 'module';
        if (!failedModule && event.target !== window) return;
        console.error('[Saber] Application script failed:', event.error || event.message || event.target.src);
        const showFailure = () => {
          const app = document.getElementById('app');
          if (app && !app.hasChildNodes()) {
            app.textContent = 'تعذر تحميل التطبيق. يرجى تحديث الصفحة.';
          }
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', showFailure, { once: true });
        } else {
          showFailure();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
